[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "media-manager"
version = "0.1.0"
description = "Media Manager API for managing physical media collections"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
